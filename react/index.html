<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/images/favicon.svg"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/images/favicon_light.svg"
      media="(prefers-color-scheme: dark)"
    />
    <link
      rel="icon"
      type="image/png"
      href="/images/favicon.png"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/png"
      href="/images/favicon_light.png"
      media="(prefers-color-scheme: dark)"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>Better Admin</title>
    <meta name="title" content="Better Admin" />
    <meta
      name="description"
      content="Better Admin — 基于统一设计与业务逻辑，使用多技术栈实现的全栈 Admin 系统。"
    />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://react.baiwumm.com" />
    <meta property="og:title" content="Better Admin" />
    <meta
      property="og:description"
      content="Better Admin — 同一套产品、同一套 UI、同一套业务逻辑、同一套数据库，分别用不同技术栈完成实现。"
    />
    <meta
      property="og:image"
      content="https://react.baiwumm.com/images/logo.png"
    />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://shadcn-admin.netlify.app" />
    <meta property="twitter:title" content="Better Admin" />
    <meta
      property="twitter:description"
      content="Better Admin — 全栈 Admin 实践项目（React / Vue / Next.js / Nuxt / NestJS）。"
    />
    <meta
      property="twitter:image"
      content="https://react.baiwumm.com/images/logo.png"
    />

    <!-- font family -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Manrope:wght@200..800&display=swap"
      rel="stylesheet"
    />

    <meta name="theme-color" content="#fff" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
