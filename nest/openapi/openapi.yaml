      description: >-
        支持 search 模糊过滤（label / i18n_key / to，命中节点保留祖先链）；
        order 控制每层按 sort 升降序。to 非空时全局唯一（部分唯一索引兜底），
        且必须以 / 或 https:// 开头（MENU_TO_EXISTS / MENU_TO_INVALID）。
