                      $ref: '#/components/schemas/User'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Users]
      summary: 创建用户
      x-permission: ADD
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: 用户名/邮箱已存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: USERNAME_EXISTS
                message: 用户名已存在
    delete:
      tags: [Users]
      summary: 批量删除用户（逗号分隔 ID 列表）
      description: >
        通过 Query 参数 ids 传递逗号分隔的用户 ID 列表（如 ?ids=id1,id2,id3）进行批量软删。
        若 ID 列表过长导致 URL 超长，允许降级为 POST /api/users/batch-delete（请求体传 ids 数组）；
        初版统一使用 DELETE + Query。
      x-permission: BATCH_DELETE
      parameters:
        - name: ids
          in: query
          required: true
          schema:
            type: string
          description: 逗号分隔的用户 ID 列表
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    nullable: true
        '400':
          description: |
            部分 ID 无效或越权（INVALID_OPERATION）；或列表包含当前登录用户本人（SELF_OPERATION_FORBIDDEN，v1.4.6）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidOperation:
                  value:
                    code: INVALID_OPERATION
                    message: 部分用户 ID 无效或无权限操作
                selfOperation:
                  value:
                    code: SELF_OPERATION_FORBIDDEN
                    message: 不能操作当前登录用户
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 无权限（FORBIDDEN）；或列表包含受保护用户（v1.4.6）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                forbidden:
                  value:
                    code: FORBIDDEN
                    message: 无权限
                adminProtected:
                  value:
                    code: ADMIN_USER_PROTECTED
                    message: 系统内置管理员账号不可操作
                superAdminProtected:
                  value:
                    code: SUPER_ADMIN_USER_PROTECTED
                    message: 该用户绑定了超级管理员角色，不可操作

  /users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
