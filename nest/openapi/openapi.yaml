  # ===================== Logs =====================
  /logs:
    get:
      tags: [Logs]
      summary: 日志列表
      x-permission: SEARCH
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, default: 10, enum: [10, 20, 30, 40, 50] }
        - name: type
          in: query
          schema: { type: string, enum: [operation, login, api, error] }
        - name: search
          in: query
          schema: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Log'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      tags: [Logs]
      summary: 批量删除日志（逗号分隔 ID 列表，v1.4.8）
      description: >
        通过 Query 参数 ids 传递逗号分隔的日志 ID 列表（如 ?ids=id1,id2,id3）进行批量删除。
        语义与 DELETE /users?ids= 对齐：任一 ID 无效即整体拒绝（400 INVALID_OPERATION），全有全无。
      x-permission: BATCH_DELETE
      parameters:
        - name: ids
          in: query
          required: true
          schema:
            type: string
          description: 逗号分隔的日志 ID 列表
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    nullable: true
        '400':
          description: 部分 ID 无效（INVALID_OPERATION）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INVALID_OPERATION
                message: 部分日志 ID 无效
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

