# 语言包一致性检查：next 与 react 的语言包（i18n/locales）必须逐 key 逐值一致。
# 差异即失败并输出差异报告，强制开发者同步语言包后才能合并 PR。
# 对比脚本：apps/next/scripts/check-locales.mjs（pnpm check-locales）

name: check-locales

on:
  pull_request:
    branches: [main]

jobs:
  check-locales:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/next/pnpm-lock.yaml

      # check-locales 只做文件对比，无运行时依赖；
      # 但脚本经由 next/package.json scripts 入口，安装以保证执行环境一致
      - name: Install dependencies (next)
        working-directory: apps/next
        run: pnpm install --frozen-lockfile

      - name: Check locales consistency (next vs react)
        working-directory: apps/next
        run: pnpm check-locales
