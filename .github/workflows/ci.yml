# 六端构建校验矩阵（审计台账 #45）
#
# 背景：此前仓库只有 check-locales（仅装 apps/next）与 clean-logs 两个 workflow，
# 六端的 lint / typecheck / test / build **从未在 CI 上被验证过**——本轮上线前审计
# 发现的 Nuxt 缺 `/logs/{id}` 端点、文档站整片数字失真，本质都是"没有机器替我们看"。
#
# 设计约束（与 AGENTS §3 / §15 一致性对齐）：
#   · 各端是相互独立的应用，各有自己的 pnpm-lock.yaml（lockfileVersion 全部 9.0），
#     仓库不引入 workspace；故用 working-directory 逐端安装，不做根级统一 install。
#   · pnpm 版本取各端自己的声明：react / vue / nuxt 的 package.json 钉了 packageManager
#     （react / vue = 11.24.0，nuxt = 12.3.4；2026-09-23 起 react / vue 钉版本，
#     因 CF Workers Builds 默认 pnpm 10 会把纯配置的 pnpm-workspace.yaml 误判为
#     workspace 声明而报「packages field missing or empty」），next / nest / website
#     无此字段，沿用本仓库已验证可行的 pnpm 11（与 check-locales.yml 一致）。
#   · 执行的是各端 package.json 里既有的 script，不另造命令。注意 react / vue / next /
#     nest 的 `lint` 自带 --fix：CI 里它会改工作区文件但不回推，只用于取退出码。
#   · website 仅有 dev/build/start，故只跑 build（Next 会顺带做类型检查）。
#   · 无 `test` 脚本的端（next / website）跳过 test。nest 的 e2e 需要真实 PostgreSQL
#     （统一矩阵模板给不了），由下方独立的 nest-e2e job 承接（2026-09-25 台账 #46 落地）：
#     CI 起自托管 TLS postgres 容器（应用内 db/client.ts 硬编码 SSL），测试在库内
#     自建/自删 e2e schema。不连 Supabase——免费层直连域名仅 IPv6，runner 无 IPv6 出站。
#
# 若 nuxt 在 pnpm 12 下因供应链策略（allowBuilds / minimumReleaseAge）报红，
# 处理顺序见 docs/mechanisms.md §35，不要直接放宽策略。

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# 同一分支的新提交取消仍在跑的旧任务，避免白烧额度
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: ${{ matrix.app }} · ${{ matrix.step }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # next build 收集 /api/* page data 时会执行 server 模块顶层，要求 DATABASE_URL 已设置；
      # postgres.js 为惰性连接，占位值仅通过构建期初始化、不会发生真实数据库访问。
      # 本地 build 不受影响（读各端 .env 的真实值）。
      DATABASE_URL: postgresql://build-placeholder:build-placeholder@localhost:5432/build
    strategy:
      fail-fast: false
      matrix:
        include:
          # ---- React（UI Source of Truth）----
          - app: react
            pnpm: 11.24.0
            step: lint
          - app: react
            pnpm: 11.24.0
            step: test
          - app: react
            pnpm: 11.24.0
            step: build
          # ---- Vue ----
          - app: vue
            pnpm: 11.24.0
            step: lint
          - app: vue
            pnpm: 11.24.0
            step: type-check
          - app: vue
            pnpm: 11.24.0
            step: test
          - app: vue
            pnpm: 11.24.0
            step: build
          # ---- Next.js（build 内含类型检查；无 test 脚本）----
          - app: next
            pnpm: 11
            step: lint
          - app: next
            pnpm: 11
            step: check-locales
          - app: next
            pnpm: 11
            step: build
          # ---- Nuxt（packageManager 钉 pnpm 12.3.4）----
          - app: nuxt
            pnpm: 12.3.4
            step: lint
          - app: nuxt
            pnpm: 12.3.4
            step: typecheck
          - app: nuxt
            pnpm: 12.3.4
            step: test
          - app: nuxt
            pnpm: 12.3.4
            step: build
          # ---- NestJS（lint / build 入矩阵；e2e 见独立 job）----
          - app: nest
            pnpm: 11
            step: lint
          - app: nest
            pnpm: 11
            step: build
          # ---- 文档站（仅 build）----
          - app: website
            pnpm: 11
            step: build

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ matrix.pnpm }}

      - uses: actions/setup-node@v4
        with:
          # 与各端 lockfile（9.0）及本地 Volta 环境同大版本线
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/${{ matrix.app }}/pnpm-lock.yaml

      - name: Install (${{ matrix.app }})
        working-directory: apps/${{ matrix.app }}
        run: pnpm install --frozen-lockfile

      - name: ${{ matrix.step }} (${{ matrix.app }})
        working-directory: apps/${{ matrix.app }}
        run: pnpm run ${{ matrix.step }}

  # Nest e2e（2026-09-25，台账 #46 落地）：需真实 PostgreSQL，无法进统一矩阵模板，
  # 独立 job 承接。不连 Supabase（免费层直连域名仅 IPv6、runner 无 IPv6 出站；
  # Supavisor pooler 对 options 启动参数支持不稳定）——起本地 TLS postgres 容器，
  # 行为与 Supabase 直连一致（原生支持 search_path 启动参数）。测试自行在库内
  # 重建/清理 e2e schema，机制见 apps/nest/test/setup/global-setup.ts 与
  # docs/mechanisms.md §42。
  nest-e2e:
    name: nest · e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_TEST_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4

      # 应用内 db/client.ts 统一配置 ssl: { rejectUnauthorized: false }（对齐 Supabase），
      # 容器必须启用 TLS；证书读写挂载以让 entrypoint 修复 key 属主权限
      - name: Start PostgreSQL 16 (TLS)
        run: |
          mkdir certs
          openssl req -new -x509 -days 1 -nodes -subj "/CN=postgres" \
            -keyout certs/server.key -out certs/server.crt
          chmod 600 certs/server.key
          # key 属主必须为数据库用户：alpine 版 postgres uid=70，entrypoint 不修复自定义路径
          docker run --rm -v "$PWD/certs:/certs" alpine chown 70:70 /certs/server.key
          docker run -d --name e2e-pg -p 5432:5432 \
            -e POSTGRES_PASSWORD=postgres \
            -v "$PWD/certs:/certs" \
            postgres:16-alpine \
            postgres -c ssl=on -c ssl_cert_file=/certs/server.crt -c ssl_key_file=/certs/server.key
          for i in $(seq 1 30); do
            PGPASSWORD=postgres psql "host=localhost user=postgres dbname=postgres sslmode=require" \
              -c 'select 1' >/dev/null 2>&1 && exit 0
            sleep 1
          done
          echo "::error::postgres 30s 内未就绪"
          docker logs --tail 50 e2e-pg
          exit 1

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/nest/pnpm-lock.yaml

      - name: Install (nest)
        working-directory: apps/nest
        run: pnpm install --frozen-lockfile

      - name: test (nest e2e)
        working-directory: apps/nest
        run: pnpm test
