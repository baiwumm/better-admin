# 日志清理——**仅手动补跑入口**（2026-09-22 决定 A，见 docs/launch-audit.md #45）。
#
# 自动路径已收敛为 Nest 进程内唯一一条：apps/nest/src/modules/logs/log-cleanup.service.ts
# （@Cron LOG_CLEANUP_CRON，缺省每日 03:00 Asia/Shanghai，LOG_RETENTION_DAYS=30）。
# 本 workflow 原先也带每日 schedule，与 Nest 侧幂等重复、结果无害，但代价是
# 「一份能 DELETE 生产库的写凭据每天被自动使用一次」；GitHub 侧并非必需（Nest 常驻
# 就能完成清理），故去掉定时触发，只保留 workflow_dispatch 作为 Nest 侧故障 / 停机后
# 的人工补跑通道。
#
# ⚠️ 依赖关系：Nest 部署在 Render 免费层，15 分钟不活跃即休眠 ⇒ 进程内 cron 不跑。
# 因此本决定的成立前提是 AGENTS §17 ① 的外部保活（GET /api/health + UptimeRobot /
# CF Worker Cron 每 5-10 分钟 **HTTP(S) 类型**探活）已配置且真在生效——探活类型误配成
# PING（ICMP）等同于没配（2026-09-23 实测空转 6 小时，判据见 docs/mechanisms.md §39）；
# 未配置前日志可能长期不清理（只影响表大小，不影响功能）。补跑时：仓库 Secrets 需有 DATABASE_URL（与 Nest 同库）。

name: clean-logs

on:
  # 定时触发已移除（决定 A）：自动清理由 Nest 进程内 @Cron 承担，此处仅留人工补跑。
  workflow_dispatch: {}

concurrency:
  group: clean-logs
  cancel-in-progress: false

jobs:
  clean-logs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/next/pnpm-lock.yaml

      - name: Install dependencies (next)
        working-directory: apps/next
        run: pnpm install --frozen-lockfile

      # 脚本自身读取 DATABASE_URL / LOG_RETENTION_DAYS 环境变量（见 clean-logs.mjs）
      - name: Run log cleanup
        working-directory: apps/next
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LOG_RETENTION_DAYS: ${{ vars.LOG_RETENTION_DAYS || '30' }}
        run: pnpm db:clean-logs
