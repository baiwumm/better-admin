name: 💡 功能建议
description: 提出新功能或改进想法（讨论阶段的想法也可以先发 Discussions 的 Ideas）
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        本项目是「同一产品、五套技术栈独立实现」，任何新功能都要评估 **React / Vue / Next.js / Nuxt / NestJS 五端** 与数据库、OpenAPI 契约的影响。
        如果只是想先讨论方向，建议发到 [Discussions · Ideas](https://github.com/baiwumm/better-admin/discussions/categories/ideas)。

  - type: textarea
    id: problem
    attributes:
      label: 需求背景
      description: 你遇到的场景与痛点；这比直接给方案更有助于判断是否值得做
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望方案
      description: 交互、界面或接口层面的预期效果
    validations:
      required: true

  - type: dropdown
    id: apps
    attributes:
      label: 需要覆盖的端
      multiple: true
      options:
        - React (apps/react)
        - Vue (apps/vue)
        - Next.js (apps/next)
        - Nuxt (apps/nuxt)
        - NestJS API (apps/nest)
        - 文档站 / 官网 (apps/website)
        - 暂不确定
    validations:
      required: true

  - type: checkboxes
    id: impact
    attributes:
      label: 影响面自评
      description: 勾选你判断会涉及的层面，便于提前评估改动范围
      options:
        - label: 需要修改数据库 Schema（17 张表的任一张）
        - label: 需要修改 OpenAPI 契约（apps/nest/openapi/openapi.yaml 先行）
        - label: 只影响前端页面 / 交互，不动数据层
        - label: 需要新增依赖

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 你考虑过的其它做法，以及为什么不采用
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 参考实现、截图、同类产品截图等
    validations:
      required: false
