<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#020817" />
    <title>Better Admin</title>
    <script>
      // 主题防闪烁：与 Nuxt UI（@vueuse/core color mode）的存储键对齐，
      // 在首帧前根据持久化值/系统偏好同步设置 dark class
      try {
        var stored = localStorage.getItem("vueuse-color-scheme");
        if (stored === '"dark"' || (!stored && matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {
        /* ignore */
      }
    </script>
  </head>
  <body>
    <div id="app" class="isolate"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
