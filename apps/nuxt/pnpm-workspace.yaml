allowBuilds:
  '@parcel/watcher': false
  '@tailwindcss/oxide': false
  esbuild: false
  unrs-resolver: false
  vue-demi: false
overrides:
  vue: 3.5.45
  '@internationalized/date': 3.12.4
  # 2026-11-19 Dependabot 告警收敛：只把受影响区间内的传递依赖抬到已修复版本
  'shell-quote@>=1.8.4 <1.11.0': 1.11.0
  'tar@<=7.5.20': 7.5.21
  'source-map-js@<1.2.2': 1.2.2
  'js-yaml@>=4.0.0 <4.3.2': 4.3.2
  'devalue@>=5.0.0 <5.9.3': 5.9.3
  'prosemirror-view@<1.42.3': 1.42.3
  'nanoid@>=3.0.0 <3.3.18': 3.3.20
  'vue-i18n@<11.4.14': 11.4.21
  '@intlify/core-base@<11.4.14': 11.4.21
  '@intlify/core@<11.4.14': 11.4.21
  '@intlify/shared@<11.4.14': 11.4.21
  'serialize-javascript@<7.1.3': 7.1.3
  'postcss-selector-parser@>=7.0.0 <7.1.6': 7.1.6
  'node-forge@<1.4.3': 1.4.3
  'undici@>=8.0.0 <8.12.2': 8.12.4
  'brace-expansion@>=4.0.0 <5.0.12': 5.0.12
  '@babel/core@<=7.29.0': 7.29.7
  'vite@>=8.2.0 <=8.2.3': 8.2.4

# 供应链策略兼容：trustPolicy: no-downgrade 会对「早期版本带 provenance、
# 后发布版本不带」的存量老包批量误报（semver@6.3.1 / undici-types@6.21.0
# 均为多年稳定使用的已知安全版本），与 next 端同一方案：
# 发布超过 1 年（525600 分钟）的包跳过信任检查，保留对新增发布版本的降级防护。
trustPolicyIgnoreAfter: 525600
