allowBuilds:
  '@scarf/scarf': true
  bcrypt: true
  esbuild: false
# 2026-11-19 Dependabot 告警收敛：只把受影响区间内的传递依赖抬到已修复版本
# （处置明细与未修的 minimatch / esbuild 见 docs/progress.md 同日条目）
overrides:
  'proxy-addr@<2.0.8': 2.0.8
  'body-parser@>=2.0.0 <2.4.0': 2.4.0
  'multer@>=2.0.0 <2.5.0': 2.5.0
  'qs@>=6.7.0 <=6.16.0': 6.16.1
  'fast-uri@>=3.0.0 <3.1.9': 3.1.9
  'source-map-js@<1.2.2': 1.2.2
  'picomatch@>=4.0.0 <4.0.4': 4.0.4
  'brace-expansion@<1.1.21': 1.1.21
  'brace-expansion@>=4.0.0 <5.0.12': 5.0.12
  'vite@>=8.3.0 <=8.3.2': 8.3.3
# 全局 trustPolicy: no-downgrade 会对"早期版本带 provenance、后发布版本不带"的老包批量误报
# （如 chokidar@4.0.3、@eslint/core@0.10.0，均为 2024-2025 年发布的已知安全版本）。
# 此处配置发布超过 1 年（525600 分钟）的包跳过信任检查，保留对新增发布版本的降级防护
trustPolicyIgnoreAfter: 525600
