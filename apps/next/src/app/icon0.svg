<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Better Admin">
  <title>Better Admin Favicon</title>
  <desc>图标专用几何（16 / 32 优化）：元素安全区放大到 52–204，竖柱加粗到 64，两碗间距放宽到 32，字腔放大到 48x36，使 16px 下「B」的双碗仍可分辨。亮暗两态共用同一个 mask（形状只定义一次），按 prefers-color-scheme 切换；#light-icon = 黑底白块（亮色浏览器），#dark-icon = 白底黑块（暗色浏览器）。</desc>
  <style>
    #light-icon{display:inline}
    #dark-icon{display:none}
    @media (prefers-color-scheme: dark){
      #light-icon{display:none}
      #dark-icon{display:inline}
    }
  </style>
  <defs>
    <mask id="ba-favicon-shape">
      <rect width="256" height="256" fill="black"/>
      <g fill="white">
        <rect x="52" y="52" width="64" height="152" rx="20" ry="20"/>
        <rect x="112" y="52" width="92" height="60" rx="20" ry="20"/>
        <rect x="112" y="144" width="92" height="60" rx="20" ry="20"/>
      </g>
      <g fill="black">
        <rect x="136" y="64" width="48" height="36" rx="16" ry="16"/>
        <rect x="136" y="156" width="48" height="36" rx="16" ry="16"/>
      </g>
    </mask>
  </defs>
  <g id="light-icon">
    <rect width="256" height="256" rx="57" ry="57" fill="#0A0A0A"/>
    <rect width="256" height="256" fill="#FFFFFF" mask="url(#ba-favicon-shape)"/>
  </g>
  <g id="dark-icon">
    <rect width="256" height="256" rx="57" ry="57" fill="#FFFFFF"/>
    <rect width="256" height="256" fill="#0A0A0A" mask="url(#ba-favicon-shape)"/>
  </g>
</svg>
