            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: POST_HAS_ACTIVE_USERS
                message: 该岗位下存在 3 名在职人员，请先调岗或离职处理

  /org/posts/{id}/members:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Posts]
      summary: 岗位在职人员名单（在职人数穿透）
      description: 仅返回在职（employment_status=employed）且未删除的用户；点击岗位列表「在职人数」时调用。
      x-permission: SEARCH
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, default: 10, enum: [10, 20, 30, 40, 50] }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/DirectoryEntry'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 岗位不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: POST_NOT_FOUND
                message: 岗位不存在

  /org/directory:
    get:
      tags: [Directory]
      summary: 人员通讯录（分页）
      description: >
        全员视图：users（含 v1.6.0 迁移扩展字段）× depts（组织路径递归拼接）× user_posts × posts 联查，
        实时查询无缓存。组织筛选含所选组织的全部下级组织人员（递归 CTE）；
        在职状态缺省仅返回在职人员（employmentStatus=employed），可显式传 resigned / all。
        Excel 导出属阶段 4，另行追加。
      x-permission: SEARCH
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, default: 10, enum: [10, 20, 30, 40, 50] }
        - name: deptId
          in: query
          description: 按组织筛选（该组织及全部下级组织的人员）
          schema: { type: string }
        - name: keyword
          in: query
          description: 姓名 / 工号 / 登录名模糊搜索
          schema: { type: string }
        - name: employmentStatus
          in: query
          description: 在职状态筛选；缺省 employed（离职人员默认不展示）
          schema: { type: string, enum: [employed, resigned, all], default: employed }
        - name: sort
          in: query
          schema: { type: string }
        - name: order
          in: query
          schema: { type: string, enum: [asc, desc] }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/DirectoryEntry'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
