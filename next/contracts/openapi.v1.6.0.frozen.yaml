        {userId}.{ext} 对象（对象删除失败不阻断，仅记录日志）；返回最新账户详情。
      security:
        - bearerAuth: []
      x-permission: NONE
      responses:
        '200':
          description: 删除成功（data.avatar 为 null）
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/AccountProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'

