        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    description: 顶级组织节点数组（顶级可多个，按 sort 降序）
                    items:
                      $ref: '#/components/schemas/DeptTreeNode'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /org/depts:
    get:
      tags: [Depts]
      summary: 组织列表（分页）
      description: 组织管理页右侧子组织列表与关键词搜索用；传 parentId 时返回其直接下级组织。
      x-permission: SEARCH
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, default: 10, enum: [10, 20, 30, 40, 50] }
        - name: parentId
          in: query
          description: 传则返回该组织的直接下级组织（不含更深层级）
          schema: { type: string }
        - name: keyword
          in: query
          description: 组织名称 / 编码模糊搜索
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, enum: [enabled, disabled] }
        - name: sort
          in: query
          schema: { type: string }
        - name: order
          in: query
          schema: { type: string, enum: [asc, desc] }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Dept'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Depts]
      summary: 新增组织
      x-permission: ADD
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeptCreateRequest'
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Dept'
        '400':
          description: 父级组织不存在或已停用（DEPT_PARENT_INVALID）；或负责人不存在（USER_NOT_FOUND）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                parentInvalid:
                  value:
                    code: DEPT_PARENT_INVALID
                    message: 上级组织不存在或已停用
                leaderNotFound:
                  value:
                    code: USER_NOT_FOUND
                    message: 负责人不存在
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: 组织名称或编码已存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                nameExists:
                  value:
                    code: DEPT_NAME_EXISTS
                    message: 组织名称已存在
                codeExists:
                  value:
                    code: DEPT_CODE_EXISTS
                    message: 组织编码已存在

