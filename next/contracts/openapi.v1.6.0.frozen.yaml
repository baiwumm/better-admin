  /org/depts/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Depts]
      summary: 组织详情
      x-permission: SEARCH
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Dept'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: 组织不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: DEPT_NOT_FOUND
                message: 组织不存在
    put:
      tags: [Depts]
      summary: 编辑组织
      x-permission: EDIT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeptUpdateRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Dept'
        '400':
          description: 父级为自身或自身后代（DEPT_PARENT_INVALID，防环）；或父级组织不存在 / 已停用（同码）；或负责人不存在（USER_NOT_FOUND）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                parentInvalid:
                  value:
                    code: DEPT_PARENT_INVALID
                    message: 上级组织不合法（不可移动到自身或自身下级组织下）
                leaderNotFound:
                  value:
                    code: USER_NOT_FOUND
                    message: 负责人不存在
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 组织不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: DEPT_NOT_FOUND
                message: 组织不存在
        '409':
          description: 组织名称或编码已存在（与其他未删除组织冲突）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                nameExists:
                  value:
                    code: DEPT_NAME_EXISTS
                    message: 组织名称已存在
                codeExists:
                  value:
                    code: DEPT_CODE_EXISTS
                    message: 组织编码已存在
    delete:
      tags: [Depts]
      summary: 删除组织（软删）
      description: >
        软删除（deleted_at 置位）。按顺序执行三级删除校验，任一命中即阻断：
        第 1 步存在下级组织 → 409 DEPT_HAS_CHILDREN；
        第 2 步存在岗位 → 409 DEPT_HAS_POSTS；
        第 3 步存在在职人员 → 409 DEPT_HAS_ACTIVE_USERS。
        校验通过后仍需前端二次确认弹窗。敏感操作，记录操作日志。
      x-permission: DELETE
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    nullable: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 组织不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: DEPT_NOT_FOUND
                message: 组织不存在
        '409':
          description: 删除校验未通过
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                hasChildren:
                  value:
                    code: DEPT_HAS_CHILDREN
                    message: 该组织下存在下级组织，请先删除下级组织
                hasPosts:
                  value:
                    code: DEPT_HAS_POSTS
                    message: 该组织下存在岗位，请先移除该组织下的岗位
                hasActiveUsers:
                  value:
                    code: DEPT_HAS_ACTIVE_USERS
                    message: 该组织下存在在职人员，请先调岗或离职处理

