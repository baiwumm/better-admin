          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidOperation:
                  value:
                    code: INVALID_OPERATION
                    message: 部分组织 ID 无效
                parentInvalid:
                  value:
                    code: DEPT_PARENT_INVALID
